<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="icon" type="image/png" href="assets/image/icon.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <title>Omar Dembele - Portifolio</title>
</head>
<body>
    <header class="header-expense">
        <h2>TODO - List</h2>
        <a href="explore.html#projects" class="back-icon">
            <i class="fas fa-arrow-left"></i>
        </a>
    </header>

    <!-- TODO LIST -->
    <section class="todo">
        <div class="container-todo">
            <h4>Total Price </h4>
            <h1 id="total">$0.00</h1>

            <h3>Add new product</h3>

            <form id="form_todo">

                <div class="form-control">
                    <label for="name_product">Name</label>
                    <input type="text" id="name_product" placeholder="Enter name of product...">
                </div>

                <div class="form-control">
                    <label for="amount_product">Price</label>
                    <input type="number" id="amount_product" placeholder="Enter amount..." step="0.01" min="0">
                </div>

                <button type="submit" class="btn-expense">Add product</button>

            </form>

            <h3>History</h3>

            <ul id="list-todo" class="list-todo"></ul>

        </div>
    </section>

    <script src="assets/js/index.js"></script>
</body>
</html>
