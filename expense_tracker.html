<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Expensify - Expense Tracker</title>
</head>
<body>
    <header class="header-expense">
        <h2>Expensify - Expense Tracker</h2>
        <a href="projects.html" class="back-icon">
            <i class="fas fa-arrow-left"></i>
        </a>
    </header>

   <section class="home">
        <div class="container-expense">
            <h4>Your balance</h4>
            <h1 id="balance">$0.00</h1>

            <div class="inc-exp-container">
                <div>
                    <h4>Income</h4>
                    <p id="money-plus" class="money-plus">+$0.00</p>
                </div>
                <div>
                    <h4>Expense</h4>
                    <p id="money-minus" class="money-minus">-$0.00</p>
                </div>
            </div>

            <h3>History</h3>
            <ul id="list" class="list">

            </ul>

            <h3>Add new transaction</h3>

            <form id="form">
                <div class="form-control">
                    <label for="text">Name</label>
                    <input type="text" id="text" placeholder="Enter name of transaction...">
                </div>

                <div class="form-control">
                    <label for="amount">Name</label>
                    <input type="text" id="amount" placeholder="Enter amount...">
                </div>

                <button class="btn-expense">Add transaction</button>
            </form>
        </div>
   </section>
    <script src="index.js"></script>
</body>
</html>
